<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - EventSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">EventSphere <span class="logo-badge">PRO</span></a>
            <div id="nav-user-container" class="nav-user"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Create Account</h2>
                    <p>Join EventSphere to discover and book live events</p>
                </div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="Manikanta" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="manikanta@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-phone">Phone Number *</label>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="e.g. 9876543210" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-role">Account Role *</label>
                        <select id="reg-role" class="form-control" required>
                            <option value="user">User (Standard Ticket Buyer)</option>
                            <option value="organiser">Organizer (Event Host / Manager)</option>
                            <option value="admin">Admin (System Administrator)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Password (min 6 characters)</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
