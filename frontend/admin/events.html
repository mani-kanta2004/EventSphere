<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management - EventSphere Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="dashboard.html" class="logo">EventSphere <span class="logo-badge" style="background: var(--secondary);">ADMIN</span></a>
            <div id="nav-user-container" class="nav-user"></div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="dashboard.html" class="admin-nav-item">📊 Dashboard Overview</a>
            <a href="events.html" class="admin-nav-item active">📅 Events Catalog</a>
            <a href="create-event.html" class="admin-nav-item">➕ Create Event</a>
            <a href="bookings.html" class="admin-nav-item">🎟️ All Bookings</a>
            <a href="users.html" class="admin-nav-item">👥 Registered Users</a>
        </aside>

        <main class="admin-main">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1>Events Catalog Management</h1>
                    <p style="color: var(--text-secondary);">View, edit, track capacity, or cancel platform events.</p>
                </div>
                <a href="create-event.html" class="btn btn-primary">➕ Create New Event</a>
            </div>

            <div class="table-responsive">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>City</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-events-tbody">
                        <!-- Populated via admin.js -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
