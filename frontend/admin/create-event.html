<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create / Edit Event - EventSphere Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="dashboard.html" class="logo">EventSphere <span class="logo-badge" style="background: var(--secondary);">ADMIN</span></a>
            <div id="nav-user-container" class="nav-user"></div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a href="dashboard.html" class="admin-nav-item">📊 Dashboard Overview</a>
            <a href="events.html" class="admin-nav-item">📅 Events Catalog</a>
            <a href="create-event.html" class="admin-nav-item active">➕ Create Event</a>
            <a href="bookings.html" class="admin-nav-item">🎟️ All Bookings</a>
            <a href="users.html" class="admin-nav-item">👥 Registered Users</a>
        </aside>

        <main class="admin-main">
            <div style="max-width: 800px; margin: 0 auto;">
                <h1 id="event-form-title" style="margin-bottom: 0.5rem;">Create New Event</h1>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Fill out the form below to publish an event on the platform.</p>

                <div class="auth-card" style="max-width: 100%; padding: 2.5rem;">
                    <form id="create-event-form">
                        <div class="form-group">
                            <label for="event-title">Event Title *</label>
                            <input type="text" id="event-title" class="form-control" placeholder="e.g. Chennai Music Festival 2026" required>
                        </div>

                        <div class="form-group">
                            <label for="event-description">Event Description *</label>
                            <textarea id="event-description" class="form-control" rows="4" placeholder="Detailed event schedule, highlights, rules..." required></textarea>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                            <div class="form-group">
                                <label for="event-category">Category *</label>
                                <select id="event-category" class="form-control" required>
                                    <option value="Music">Music</option>
                                    <option value="Concert">Concert</option>
                                    <option value="Technology">Technology</option>
                                    <option value="Sports">Sports</option>
                                    <option value="Business">Business</option>
                                    <option value="Comedy">Comedy</option>
                                    <option value="Workshop">Workshop</option>
                                    <option value="Cultural">Cultural</option>
                                    <option value="Other">Other (Custom Category)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="event-location">City / Location *</label>
                                <input type="text" id="event-location" class="form-control" placeholder="e.g. Chennai" required>
                            </div>
                        </div>

                        <div id="other-category-group" class="form-group" style="display: none;">
                            <label for="event-other-category">Specify Custom Category Name *</label>
                            <input type="text" id="event-other-category" class="form-control" placeholder="e.g. Gaming, Fashion, Photography">
                        </div>

                        <div class="form-group">
                            <label for="event-venue">Venue Address *</label>
                            <input type="text" id="event-venue" class="form-control" placeholder="e.g. YMCA Grounds, Royapettah" required>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                            <div class="form-group">
                                <label for="event-date">Date *</label>
                                <input type="date" id="event-date" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="event-time">Event Time (Clock Select) *</label>
                                <input type="time" id="event-time" class="form-control" required>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
                            <div class="form-group">
                                <label for="event-price">Ticket Price (₹ INR) *</label>
                                <input type="number" id="event-price" class="form-control" min="0" placeholder="999" required>
                            </div>
                            <div class="form-group">
                                <label for="event-total-tickets">Total Tickets Capacity *</label>
                                <input type="number" id="event-total-tickets" class="form-control" min="1" placeholder="500" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="event-organizer">Organizer Name</label>
                            <input type="text" id="event-organizer" class="form-control" placeholder="EventSphere Experiences">
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                            <a href="events.html" class="btn btn-secondary" style="flex: 1;">Cancel</a>
                            <button type="submit" class="btn btn-primary" style="flex: 2;">Save Event</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
