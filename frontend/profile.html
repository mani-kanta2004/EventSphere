<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EventSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">EventSphere <span class="logo-badge">PRO</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="my-bookings.html">My Bookings</a></li>
            </ul>
            <div id="nav-user-container" class="nav-user"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="auth-wrapper">
            <div class="auth-card" style="max-width: 550px;">
                <div class="auth-header">
                    <h2>User Account Profile</h2>
                    <p>Update your personal details or change password</p>
                </div>

                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-name">Full Name</label>
                        <input type="text" id="profile-name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="profile-email">Email Address (Read-only)</label>
                        <input type="email" id="profile-email" class="form-control" readonly style="opacity: 0.7; cursor: not-allowed;">
                    </div>

                    <div class="form-group">
                        <label for="profile-phone">Phone Number</label>
                        <input type="tel" id="profile-phone" class="form-control" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label>Account Role</label>
                            <input type="text" id="profile-role" class="form-control" readonly style="opacity: 0.7;">
                        </div>
                        <div class="form-group">
                            <label>Member Since</label>
                            <input type="text" id="profile-created" class="form-control" readonly style="opacity: 0.7;">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Save Profile Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
